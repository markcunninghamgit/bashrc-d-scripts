name: bash-syntax

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n every shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
              if ! err=$(bash -n "$f" 2>&1); then
                  printf 'FAIL: %s\n%s\n' "$f" "$err" >&2
                  fail=1
              else
                  printf 'OK: %s\n' "$f"
              fi
          done < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0)
          exit $fail

      - name: manage.sh --help smoke test
        run: ./manage.sh --help
